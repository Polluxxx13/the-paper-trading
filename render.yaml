# Blueprint Render : New -> Blueprint -> choisir le dépôt GitHub (Dockerfile et render.yaml à la racine du dépôt).
# Service et base dans la MÊME région : c'est ce qui permet d'utiliser l'URL interne de la base (rapide, sans SSL).
services:
  - type: web
    name: paper-trading
    runtime: docker
    region: frankfurt
    plan: starter            # le plan free s'endort après 15 min : le moteur d'ordres s'arrêterait
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    numInstances: 1          # ne jamais augmenter : deux instances exécuteraient chaque ordre deux fois
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paper-trading-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true  # généré par Render ; le changer déconnecte tout le monde
      - key: APP_PASSWORD
        sync: false          # à saisir dans le dashboard Render (8 caractères minimum)
      - key: TZ
        value: Europe/Zurich
      - key: SNAPSHOT_TIME   # heure de clôture quotidienne (fuseau SNAPSHOT_TZ)
        value: "22:05"
      - key: SNAPSHOT_TZ
        value: Europe/Zurich

databases:
  - name: paper-trading-db
    region: frankfurt
    plan: basic-256mb        # le plan free expire après 30 jours
    databaseName: papertrading
    ipAllowList: []          # base joignable uniquement depuis les services Render (pas d'accès public)
